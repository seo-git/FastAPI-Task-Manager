
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #243b80;
            color: white;
            padding: 25px 8%;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            color: #dbe5ff;
        }

        main {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat, .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #15264a0d;
        }

        .stat p {
            color: #64748b;
            margin: 0 0 10px;
        }

        .stat strong {
            font-size: 28px;
        }

        .panel {
            margin-bottom: 22px;
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5dce8;
            border-radius: 7px;
            font: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary {
            background: #3157c8;
            color: white;
            margin-top: 15px;
        }

        .complete {
            background: #dcfce7;
            color: #166534;
        }

        .delete {
            background: #fee2e2;
            color: #991b1b;
        }

        .task {
            border: 1px solid #e4e9f2;
            padding: 16px;
            border-radius: 9px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .task h3 {
            margin: 0 0 7px;
            overflow-wrap: anywhere;
        }

        .task p {
            margin: 0;
            color: #64748b;
            overflow-wrap: anywhere;
        }

        .task.done h3 {
            text-decoration: line-through;
            color: #64748b;
        }

        .actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        #message {
            margin-top: 12px;
            font-size: 14px;
        }

        .empty {
            color: #64748b;
            padding: 15px 0;
        }

        @media (max-width: 560px) {
            header {
                padding: 22px 20px;
            }

            .stats {
                gap: 8px;
            }

            .stat {
                padding: 12px;
            }

            .stat strong {
                font-size: 23px;
            }

            .task {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>My Task Manager</h1>
        <p>Plan your work. Track your progress. Get things done.</p>
    </header>

    <main>
        <section class="stats">
            <div class="stat">
                <p>Total Tasks</p>
                <strong id="total">0</strong>
            </div>

            <div class="stat">
                <p>Completed</p>
                <strong id="completed">0</strong>
            </div>

            <div class="stat">
                <p>Pending</p>
                <strong id="pending">0</strong>
            </div>
        </section>

        <section class="panel">
            <h2>Add a New Task</h2>

            <form id="task-form">
                <label for="title">Task title</label>
                <input
                    id="title"
                    type="text"
                    placeholder="e.g. Practise FastAPI"
                    required
                >

                <label for="description">Description</label>
                <textarea
                    id="description"
                    placeholder="What do you need to accomplish?"
                    required
                ></textarea>

                <button class="primary" type="submit">
                    + Add Task
                </button>
            </form>

            <p id="message" role="status"></p>
        </section>

        <section class="panel">
            <h2>My Tasks</h2>
            <div id="task-list">
                <p class="empty">Loading tasks...</p>
            </div>
        </section>
    </main>

    <script>
        const taskList = document.getElementById("task-list");
        const form = document.getElementById("task-form");
        const message = document.getElementById("message");

        async function loadTasks() {
            try {
                const response = await fetch("/tasks");

                if (!response.ok) {
                    throw new Error("Could not load tasks");
                }

                const data = await response.json();
                const tasks = data.tasks;

                document.getElementById("total").textContent =
                    tasks.length;

                document.getElementById("completed").textContent =
                    tasks.filter(task => task.completed).length;

                document.getElementById("pending").textContent =
                    tasks.filter(task => !task.completed).length;

                taskList.replaceChildren();

                if (tasks.length === 0) {
                    const empty = document.createElement("p");
                    empty.className = "empty";
                    empty.textContent = "No tasks yet. Add your first task!";
                    taskList.appendChild(empty);
                    return;
                }

                tasks.forEach(task => {
                    const card = document.createElement("div");
                    card.className = "task" +
                        (task.completed ? " done" : "");

                    const details = document.createElement("div");
                    const heading = document.createElement("h3");
                    const description = document.createElement("p");

                    heading.textContent = task.title;
                    description.textContent = task.description;

                    details.append(heading, description);

                    const actions = document.createElement("div");
                    actions.className = "actions";

                    if (!task.completed) {
                        const completeButton =
                            document.createElement("button");

                        completeButton.className = "complete";
                        completeButton.textContent = "Complete";

                        completeButton.addEventListener("click", () =>
                            updateTask(task.id)
                        );

                        actions.appendChild(completeButton);
                    }

                    const deleteButton =
                        document.createElement("button");

                    deleteButton.className = "delete";
                    deleteButton.textContent = "Delete";

                    deleteButton.addEventListener("click", () =>
                        deleteTask(task.id)
                    );

                    actions.appendChild(deleteButton);
                    card.append(details, actions);
                    taskList.appendChild(card);
                });
            } catch (error) {
                taskList.textContent = "Unable to load tasks. " +
                    "Check that the FastAPI server is running.";
            }
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();

            const task = {
                title: document.getElementById("title").value.trim(),
                description:
                    document.getElementById("description").value.trim()
            };

            if (!task.title || !task.description) {
                message.textContent =
                    "Please enter both a title and description.";
                return;
            }

            try {
                const response = await fetch("/tasks", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(task)
                });

                if (!response.ok) {
                    throw new Error("Task creation failed");
                }

                form.reset();
                message.textContent = "Task created successfully!";
                await loadTasks();
            } catch (error) {
                message.textContent =
                    "Could not create task. Please try again.";
            }
        });

        async function updateTask(id) {
            try {
                const response = await fetch(
                    `/tasks/${id}/complete`,
                    { method: "PATCH" }
                );

                if (!response.ok) {
                    throw new Error("Update failed");
                }

                message.textContent = "Task completed!";
                await loadTasks();
            } catch (error) {
                message.textContent = "Could not update task.";
            }
        }

        async function deleteTask(id) {
            if (!confirm("Are you sure you want to delete this task?")) {
                return;
            }

            try {
                const response = await fetch(`/tasks/${id}`, {
                    method: "DELETE"
                });

                if (!response.ok) {
                    throw new Error("Delete failed");
                }

                message.textContent = "Task deleted successfully!";
                await loadTasks();
            } catch (error) {
                message.textContent = "Could not delete task.";
            }
        }

        loadTasks();
    </script>
</body>
</html>
